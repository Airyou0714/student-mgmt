{% extends "base.html" %}
{% block title %}{% if course %}编辑课程{% else %}新建课程{% endif %} — 学生管理系统{% endblock %}
{% block page_title %}{% if course %}编辑课程{% else %}新建课程{% endif %}{% endblock %}
{% block page_sub %}课程信息将展示在选课与成绩筛选中{% endblock %}
{% block content %}
<div class="glass-card card-pad" style="max-width: 640px">
  <form method="post">
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label" for="name">课程名称 <span class="text-danger">*</span></label>
        <input
          class="form-control"
          id="name"
          name="name"
          required
          value="{{ course.name if course else '' }}"
        />
      </div>
      <div class="col-md-6">
        <label class="form-label" for="code">课程代码</label>
        <input class="form-control" id="code" name="code" value="{{ course.code if course else '' }}" />
      </div>
      <div class="col-md-6">
        <label class="form-label" for="credits">学分</label>
        <input
          class="form-control"
          type="number"
          step="0.5"
          min="0"
          id="credits"
          name="credits"
          value="{{ course.credits if course else 0 }}"
        />
      </div>
      <div class="col-12">
        <label class="form-label" for="teacher_name">任课教师</label>
        <input
          class="form-control"
          id="teacher_name"
          name="teacher_name"
          value="{{ course.teacher_name if course else '' }}"
        />
      </div>
      <div class="col-12">
        <label class="form-label" for="remark">备注</label>
        <textarea class="form-control" id="remark" name="remark" rows="2">{{ course.remark if course else '' }}</textarea>
      </div>
    </div>
    <div class="mt-4 d-flex flex-wrap gap-2">
      <button type="submit" class="btn btn-primary">保存</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('main.courses_list') }}">返回</a>
    </div>
  </form>
</div>
{% endblock %}
