{% extends "base.html" %}
{% block title %}{% if grade %}编辑成绩{% else %}录入成绩{% endif %} — 学生管理系统{% endblock %}
{% block page_title %}{% if grade %}编辑成绩{% else %}录入成绩{% endif %}{% endblock %}
{% block page_sub %}仅允许为已选课的学生录入对应课程成绩{% endblock %}
{% block content %}
<div class="glass-card card-pad" style="max-width: 720px">
  <form method="post">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="student_id">学生 <span class="text-danger">*</span></label>
        <select class="form-select" id="student_id" name="student_id" required>
          <option value="" disabled {% if not grade %}selected{% endif %}>请选择…</option>
          {% for s in students %}
          <option
            value="{{ s.id }}"
            {% if grade and grade.student_id == s.id %}selected{% endif %}
          >
            {{ s.student_no }} · {{ s.name }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="course_id">课程 <span class="text-danger">*</span></label>
        <select class="form-select" id="course_id" name="course_id" required>
          <option value="" disabled {% if not grade %}selected{% endif %}>请选择…</option>
          {% for c in courses %}
          <option
            value="{{ c.id }}"
            {% if grade and grade.course_id == c.id %}selected{% endif %}
          >
            {{ c.name }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="title">成绩项 <span class="text-danger">*</span></label>
        <input
          class="form-control"
          id="title"
          name="title"
          required
          value="{{ grade.title if grade else '' }}"
          placeholder="例如：期中、期末、平时"
        />
      </div>
      <div class="col-md-3">
        <label class="form-label" for="score">得分 <span class="text-danger">*</span></label>
        <input
          class="form-control"
          type="number"
          step="0.01"
          id="score"
          name="score"
          required
          value="{{ grade.score if grade else '' }}"
        />
      </div>
      <div class="col-md-3">
        <label class="form-label" for="max_score">满分</label>
        <input
          class="form-control"
          type="number"
          step="0.01"
          min="0.01"
          id="max_score"
          name="max_score"
          value="{{ grade.max_score if grade else 100 }}"
        />
      </div>
    </div>
    <div class="mt-4 d-flex flex-wrap gap-2">
      <button type="submit" class="btn btn-primary">保存</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('main.grades_list') }}">返回列表</a>
    </div>
  </form>
</div>
{% endblock %}
