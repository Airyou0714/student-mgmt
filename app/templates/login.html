{% extends "base.html" %}
{% block title %}登录 — 学生管理系统{% endblock %}
{% block content %}
<div class="guest-card">
  <div class="guest-badge"><i class="bi bi-stars"></i> 本地 SQLite · 精致界面</div>
  <h1 class="h4 mb-1 fw-bold">欢迎回来</h1>
  <p class="text-muted small mb-4">使用管理员账号登录以管理学生、课程与考勤。</p>
  <form method="post" action="{{ url_for('main.login') }}">
    <div class="mb-3">
      <label class="form-label" for="username">用户名</label>
      <input
        class="form-control form-control-lg"
        id="username"
        name="username"
        autocomplete="username"
        required
        placeholder="admin"
      />
    </div>
    <div class="mb-4">
      <label class="form-label" for="password">密码</label>
      <input
        class="form-control form-control-lg"
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        required
      />
    </div>
    <button type="submit" class="btn btn-primary btn-lg w-100">进入系统</button>
  </form>
</div>
{% endblock %}
